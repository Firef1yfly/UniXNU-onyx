schema_version = 2

[board]
example = true
name = "onyx"
soc = "SM8735"
soc_source = "sm8735"
os_profile = "ipados-17.7.11-21H461"
description = "Redmi Turbo 4 Pro"
kit = "onyx"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "onyx_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8735.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/onyx-bringup.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "onyx"
dsc = "Platforms/Xiaomi/onyxPkg/onyx.dsc"
fd = "Build/onyxPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Mu_Basecore",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[bootimg]
# Firmware boot DTB selection is unresolved; never use the minimal ADT hardware DTS here.

[bootimg.image]
# Current UniXNU reads this table, not Mu's [boot_image_kernel].
# Match the onyx firmware source's uncompressed BootShim requirement explicitly.
kernel_compression = "none"

[firmware.defines]
DEVICE_MODEL = "onyx"
ENABLE_SECUREBOOT = "0"

[payload]
volume = "ONYX"
size_mib = 192
loader = "firmware"
title = "UniXNU"
tools = true
kernel_args = ["-v", "serial=3"]

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "onyx_defconfig"

[payload.adt]
chip_id = "207"
# Identity seed must be supplied locally; never commit a value.
unique_chip_id = "required"
