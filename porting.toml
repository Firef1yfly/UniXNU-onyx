findings = ["Offline check-inputs.py rejects incomplete sources, zero-size literal memory, fixed identity seeds and missing board provenance. The firmware acceptance script added in this diff inspects a supplied FD and source INF GUIDs; synthetic parser fixtures do not qualify a real FD. The QR exporter is reachable only from an interactive Tools menu. Every subsystem remains planned. scripts/accept-firmware.py is the only gate an FD passes before a device attempt, and it is hash-bound: it reports the FD SHA-256 it read, resolves the nine required modules by GUID from the decompressed inner volume, and checks 14 SEC guard markers extracted from the current OnyxHandoff.c, so a volume built with the guard compiled out fails instead of passing on structure alone. docs/firmware-acceptance.json now carries the manifest of an accepted 3 MiB volume (seven outer FFS files, 110 inner FFS files, nested LZMA section EE4E5898 and wrapper 9E21FD93) and still records hardware_tested false. The script proves volume structure and module presence only; it says nothing about authentication, dispatch or a boot. docs/firmware-acceptance.json holds the manifest of the pair a device attempt would use: FD fdc70a6b (3 MiB, 9 modules, 14 of 14 SEC guard markers, hardware_tested false), which is the volume inside image 9a77313f. The two earlier manifests of this round (13fb233b, 7ca3fe22) stay named in the firmware findings; a manifest is not a boot result. The firmware source the build consumes is now gated before the build rather than after it: scripts/check-firmware-inputs.py is the board's [firmware] preflight and refuses a Mu-Silicium checkout that is not at the endpoint of patches/uefi/ - each changed file's blob, as recorded by the last patch that touches it, is compared with git hash-object, so a tree one patch old or hand-edited fails and the message names the files - plus a board configuration whose uefi_fd base/size, boot_image_kernel compression, header_version or requires_kernel_header disagree with what this port needs, a board.toml compression setting that differs from the firmware's own, and an onyx.dsc/onyx.fdf that lost the PE alignment, the FdtLib mapping, the -DONYX_FDT_HANDOFF=1 switch or one of the eight required modules. Without UNIXNU_UEFI it skips with a message, so `unixnu package --check` still runs; --require-uefi turns the skip into a failure. tests/test_firmware_inputs.py (12 tests) drives fixture trees and checks each refusal names its cause. It is a source-tree gate: a green run says the tree matches the reviewed series, never that the volume boots. The design document's open timer question is settled on evidence rather than preference: BonitoPkg, the package onyx.dsc includes, sets USE_PHYSICAL_TIMER=0, which SiliciumPkg.dsc.inc turns into ArmGenericTimerVirtCounterLib (the CNTVCT_EL0 virtual counter), no interrupt-number override is needed because the ArmPkg defaults 30 and 27 are the Qualcomm PPIs, and the pre-hand-off panel frames show increasing DEBUG timestamps across sixty modules plus a ten-second Stall in the unable-to-boot path, which a frozen counter could not produce. onyx.dsc therefore keeps the family default and adds no timer override; a log whose timestamps stop changing, or a Stall that returns instantly, is the observation that would reopen it. A second gap was found by reading the call site: BdsEntry reaches PlatformBootManagerAfterConsole() after the driver load options and EfiBootManagerConnectAllDefaultConsoles() but before any ConnectAll, which runs only inside EfiBootManagerBoot(), so at the hook every driver is dispatched and no driver is attached to any device. UniXNULib/Config.c finds its configuration through LocateHandleBuffer(ByProtocol, gEfiSimpleFileSystemProtocolGuid) and UniXNURamDiskDxe publishes only BlockIo and DevicePath, so without a connection the payload volume would not exist as a filesystem at all and the menu would have started without its own configuration. DeviceBootManagerAfterConsole() now connects the block devices (and only those - the application's firmware volume is already connected) before the hand-off and logs the filesystem count that follows, which is the bring-up signal for milestone step 5. New artefacts: FD 13fb233b585b05d08f68f5124a0e737f37561553eb085a61714fccede0d3880d, accepted with 9 modules, 14 of 14 SEC guard markers and 12 ONYX-BOOT ac markers inside the decompressed volume, and the menu image out/onyx-menu-boot.img a4c34dd2e2b97cc087321bcf7ad84d3eeaec2ff878cb1f1b29ce8bd5032f32d5 whose kernel field re-hashes to that FD at shim offset 256. The series still replays byte-identically. None of it has run on hardware. tests/test_porting_record.py closes the same loop for the record itself: it runs the shared checker with --base origin/main, the range the workflow uses, so an owned path changed without its area's findings updated fails locally instead of on the remote, and it asserts checker-free that every area has owned paths and every relative evidence file exists. docs/firmware-acceptance.json now holds the manifest of the volume that is actually packed into the next device attempt (FD 7ca3fe22, 3 MiB, 6 outer and 110 inner FFS files, 9 modules, 14 of 14 SEC guard markers, hardware_tested false); the earlier d1ceaae4 manifest stays readable in this record's findings and in docs/TAKEOVER-UEFI.md, and neither is a boot result."]
