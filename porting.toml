schema_version = 1

[device]
name = "onyx"
soc = "SM8735"
os_profile = "ipados-17.7.11-21H461"
summary = "Evidence-first Redmi Turbo 4 Pro (onyx) reconstruction; no device boot is claimed."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["scripts/extract-images.py", "scripts/inspect-runtime.py", "scripts/CPUID*", "tests/**", "docs/CPUID-PLATFORM-SEED.md", "board.toml", "feeds.toml", "configs/**", "soc/soc.toml", "soc/configs/**", "soc/patches/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["onyx SM8735 source graph, an existing upstream OS profile and real board hardware evidence; see docs/ONYX-REBUILD.md."]
configuration = ["Use ipados-17.7.11-21H461 and onyx_defconfig with tracked local soc/; keep board.example=true until runtime DRAM and the full build source graph are qualified. The payload's tools=true is only to expose Tools after an interactive UniXNU menu is working; it does not make the menu or QR exporter available before then."]
procedure = ["Run python3 scripts/check-inputs.py --unixnu ../unixnu, then the independent upstream porting-record check; the former is expected to fail closed."]
findings = ["The official package --check is intentionally blocked while board.example=true; the fail-closed input gate also reports missing inputs.toml provenance and unresolved static DRAM. The provisional DTS compiles to a 2.1 KiB host DTB only; this is not a boot image or runtime memory evidence.", "The repository carries the two workflows the device specification requires: porting-record.yml runs the shared record check on every push and pull request, and package.yml builds the same two artifacts from a clean checkout with the seed taken from the UNIXNU_UNIQUE_CHIP_ID secret. Pushing them needs a token with the workflow scope, which the default device token does not have. package.yml's tool gate was widened to the template's real set - xcodebuild, aea, compression_tool and ipsw from the blacktop/tap formula join clang, make, ninja, cmake, dtc, fdtget, fdtput, mformat and mcopy - because the action uploads kernel.macho and dropping the kernel and IPSW tools only moves the failure past the forty-minute build; tests/test_packaging_workflow.py pins that list and the recursion into the shared workflow. The host tests no longer assume a checkout named ../unixnu beside this repository: tests/host_fixtures.py resolves UNIXNU_HOME first and then the sibling [package] unixnu path from board.toml, so test_bootshim_patch.py, test_payload_config.py, test_sm8735_bindings.py, test_inspect_memory.py and test_assemble_menu_probe_boot.py skip with a named reason in a bare clone instead of erroring, which is the state a clean CI checkout is in. test_sm8735_bindings.py also stops pinning a revision and probes the upstream source for the zero-DRAM guard, so it re-arms by itself when a checkout carries the check again. tests/test_porting_record.py now runs the shared record check the same way the workflow does - with --base origin/main - so a change that touches an owned path without updating that area's findings fails in the local suite instead of on the remote; it skips with a reason when no UniXNU checkout or no origin/main is available, and it keeps a checker-free assertion that every area has owned paths and every relative evidence file exists. That gap was real: an earlier commit touched an owned test path with only the firmware area updated, passed the structure-only check locally and failed the push. board.toml now lists that preflight under [firmware], so the official firmware step runs it: `unixnu status --json` still resolves the board (21 modules, board.example deliberately true), and the preflight passes on the checkout that produced FD 7ca3fe22 - 19 Mu-Silicium files at the series endpoint, the 8 required FDF modules, the DSC alignment and guard switch, and both compression settings at none."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The local SoC source is minimal, not a complete platform; runtime memory, full source fetch and firmware qualification remain missing."]
next_action = ["Review source availability and runtime DRAM evidence, then verify UEFI handoff and complete kernel build inputs without disabling the board gate."]
evidence = [{ kind = "source", reference = "docs/ONYX-REBUILD.md", result = "Records pinned vendor source and the missing local SoC inputs." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["patches/uefi/**", "package/OnyxMapDxe/**", "package/OnyxBootOptions/**", "tests/test_bootshim_patch.py", "tests/test_accept_firmware.py", "scripts/accept-firmware.py", "docs/TAKEOVER-UEFI.md", "docs/BDS-ONIX-CANDIDATE.md", "docs/BDS-ISOLATED-BUILD.md", "docs/BDS-CANDIDATE-IMAGE.md", "docs/HISTORICAL-COMBO-BOOT-TEST.md", "docs/DIAGNOSTIC-BOOT.md", "docs/DEVICE-DIAGNOSTIC-FAILURE.md", "docs/EFI-MAP-DIAGNOSTIC-RESULT.md", "docs/QR-ADVANCED-LOGGER-INTEGRATION.md", "proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py", "scripts/make-menu-image.py", "scripts/device-ladder.py", "scripts/check-firmware-inputs.py", "tests/test_make_menu_image.py", "tests/test_firmware_inputs.py", "tests/test_uefi_patch_series.py", "tests/test_device_ladder.py", "tests/host_fixtures.py", "docs/bringup/ladder.md"]
inputs = ["Select the UEFI implementation, required boot services, framebuffer/input paths, and logger source for onyx; retain the source revision and artifact hash for each build."]
configuration = ["Keep board.example=true and the unresolved firmware-DTB selection. Keep kernel_compression=none aligned with the Mu device config. tools=true enables only the menu-stage Tools entry and must not be used as a pre-menu log claim."]
procedure = ["Run the offline source patch checks and scripts/accept-firmware.py against an actual 3 MiB FD; inspect BDS dispatch and framebuffer/input logs. Only proceed to device tests when an earlier log channel, recovery method and image hash are documented."]
findings = ["Firmware now executes on the device: BootShim relocates the volume, SEC runs, DXE dispatches, and DEBUG text is legible on the panel. The newest device observation is a grey frame plus a reset consistent with PlatformBootManagerUnableToBoot, so BDS ran and started no application; the cause is not localized because no log channel exists before the menu reaches its Tools entry, so the on-device QR exporter still cannot diagnose a pre-menu hang. BDS has never been observed starting UniXNU.efi, and no menu, payload discovery or QR log has ever been reached. See docs/TAKEOVER-UEFI.md, docs/DEVICE-DIAGNOSTIC-FAILURE.md and docs/QR-ADVANCED-LOGGER-INTEGRATION.md.", "The last FD inspected (Build/onyxPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd, 3,145,728 bytes, SHA-256 be68806743b96a57ccf73a28cc75ad6565243ed0ec616d5d976f55e12f19531f) carries none of the ONYX: guard markers because onyx.dsc had lost -DONYX_FDT_HANDOFF=1, so Sec.inf compiled the FDT/initrd guard out; scripts/accept-firmware.py rejected that volume for exactly that reason. The switch is restored in the live DSC and in patch 0009, and a rebuilt FD must pass the acceptance check before any device test. Two consecutive builds of identical sources differ in exactly eight bytes, the CodeView RSDS record of PcdDxe; SEC's __TIME__/__DATE__ banner was the initial suspect but is not the cause, and /Brepro on every link line did not remove the variation, so the firmware is not bit-reproducible and each tested image must be bound by its own SHA-256.", "BootShim now writes the shim-plus-FD image size, keeps the bootloader x0 instead of an appended DTB, fails closed before any store when source and destination overlap, and publishes relocated instructions with a dc cvac/dsb/ic iallu/isb sequence. SEC validates the incoming FDT with a full libfdt tree check and requires the FDT and initrd to sit inside a reserved board-input region before publishing the handoff HOB; a missing initrd is an explicit error, never a silent downgrade. All of this is host-tested only.", "A live capture on 2026-11-28 recorded linux,initrd-start=0xb5921000 and initrd-end=0xb7ffeb18, whose end is not sector aligned; the first validator rejected that genuine handoff, so the range is now rounded up to the next sector with the padded end (0xb8000000) still inside the Kernel reservation. No firmware reservation (UEFI_FD, stack, SEC/DXE heaps) overlaps the payload.", "Cross-checking the validator against the descriptors in MemoryMapLib.c exposed a real defect: XBL_DT, where the bootloader places the device tree, is a memory-reserved descriptor rather than system memory, so requiring EFI_RESOURCE_SYSTEM_MEMORY excluded the one region that must be accepted. The reservation is now the discriminating test and the name allowlist keeps display, modem PIL and AOP carve-outs out. With the live map the validator accepts a tree in XBL_DT, rounds the captured initrd end from 0xb7ffeb18 to 0xb7ffec00 inside the Kernel reservation, and rejects trees in the firmware footprint, the initrd without that reservation, and a payload running past 0xb8000000.", "The ro.boot.flash.locked=1 and verifiedbootstate=green values in that capture are disguised, not authoritative: fastboot reports unlocked: yes (product onyx, current-slot a), so the bootloader is unlocked and the lock state was never the blocker. Images did execute on the device afterwards, with BootShim relocating the volume, SEC running and DXE output reaching the panel, so the earlier reading that a locked bootloader refused the unsigned image is corrected here. See docs/TAKEOVER-UEFI.md.", "Device attempts 2026-11-28: a spin-probe shim with a valid ARM64 header that branches to itself forever was acknowledged with Booting OKAY, and the device still returned to fastboot within about a second, reproducibly after a clean reboot-bootloader. An unconditional self-branch cannot return, so the acknowledgement covers the download and not execution. The same file also produced Load Error depending on the state a previous failed attempt left behind, so one OKAY proves nothing; each result must name the image hash and whether the bootloader was freshly re-initialised. Screen state is not a signal here, since a stock boot also shows no logo until its second stage.", "Root cause of the silent boot failure found 2026-11-28: the onyx ABL adds the arm64 header text_offset to the jump address. Stock boot_a carries 0 there; every UniXNU image carried the firmware base 0xa7100000, so the CPU was sent past the end of RAM and the board fell back to fastboot. Signing is not the obstacle, since a stock image with one byte flipped still booted Android and showed the 18d1:d00d to disconnected to 18d1:4e11 pattern, while our images never produced the disconnect. Patching only text_offset to zero made a self-branching shim hang the device for the rest of the observation, so the shim was executing. make-menu-image.py now zeroes that field after the packer verifies its output and records the change. Any onyx image from the stock packer without this adjustment reports Booting OKAY and does nothing.", "Two output paths behave differently on this board: Print through ConOut and GraphicsConsole renders nothing, while DEBUG output does appear because the platform SerialPortLib draws into the framebuffer. Every earlier diagnostic that used Print therefore ran and stayed invisible, and the BDS failure message travels the same path, so a grey panel cannot be read as a specific failure. The bring-up report now uses DEBUG at ERROR level, which the platform debug level cannot filter.", "The platform debug level stays at its default: restricting it to errors made the framebuffer draw nothing at all, not even the bring-up report. Patch 0009 carries the DSC and FDF wiring for that driver and 0011 the driver itself; both must stay in step with the record.", "The bring-up report driver now depends on gEfiGraphicsOutputProtocolGuid instead of dispatching with TRUE: placed early it ran before the graphics and firmware-volume plumbing it reads, which is why its report never appeared.", "A grey panel cannot distinguish a driver that never ran from one that ran with a broken display path, so the report driver now powers the board off after printing. Staying dark instead of returning to Android is a display-independent proof that the driver executed.", "BDS never started UniXNU on the one observed boot, so the application now has a second way in: patch 0012 keeps Boot####/BootOrder as the primary path and arms a direct start only when the application's firmware volume has no device path or gRT->SetVariable fails for Boot####/BootOrder. The armed case loads the application's PE32 section once with LoadImage(TRUE, gImageHandle, NULL, ...) plus StartImage on ReadyToBoot, stands down when BootOrder turns out to list the option, and prints every decision as DEBUG_ERROR under the prefix 'ONYX-BOOT: '. Tests/OnyxBootPath covers the armed, stand-down and run-once paths on the host (9 tests, carried by patch 0013) and the built FD contains the 20 'ONYX-BOOT: ' markers inside the LZMA-compressed inner volume. It changes where the application is started from, not whether the image is trusted, and it has never run on hardware.", "The reviewed series was proved to reconstruct both trees from their pins: 0001, 0007, 0008, 0009, 0010, 0011, 0012, 0013 and 0014 applied with plain git apply (no fuzz, no conflict) onto throwaway worktrees of Mu-Silicium 1d0f1e41 and of the UniXNU checkout fdf81ea leave all 19 changed Mu files and both changed UniXNU files byte-identical with a zero-entry recursive source diff (re-run 2026-11-29 02:15 against the trees that produced FD 7ca3fe22: the same 21 files come out byte-identical, so the repository alone is sufficient to reach the tested source state)., and the reconstructed tree passes Tests/OnyxHandoff (17), Tests/test_bootshim.py (4) and Tests/OnyxBootPath (9). git apply cannot write through the UniXNUPkg symlink, so 0012 must be applied inside the UniXNU checkout with --directory=package; 0012's header records that and tests/test_uefi_patch_series.py (13 tests) pins both mounts and the two-tree requirement.", "The current FD (3,145,728 bytes, SHA-256 8b2d6b9ce58ea6f1c511774a22c4ebec6ca5fdcdf9612e492687fa6aa239d5b8) passes scripts/accept-firmware.py with all nine required modules resolved from the inner volume and carries both guard families: 18 'ONYX: ' strings in the outer volume, 9 inside the decompressed inner volume, and the 20 fallback markers above. The menu image bound to it, out/onyx-menu-boot.img (20,779,008 bytes, SHA-256 9809edcb0f9ce5df47e827666cfbda44342e40a287fe9a77e2f81bf83e5a1147), carries that exact volume at shim offset 256, with header text_offset 0 and image_size 0x300100 equal to shim plus 3 MiB. Two later builds of the same sources, the second an incremental relink, produced FD 7ca3fe22bea67afb9d0cebe15b616dc110fb8810938470a67dbe8c827c824fb1 and image out/onyx-menu-boot.img 83e75046304d6983a6e211e445737e1917d24c35f06e48f7be7e84deb6b492df, shelved as out/onyx-menu-boot-83e75046.img. That FD accepts identically - nine required modules, 14 of 14 SEC guard markers, the same 110 inner FFS files, 29 'ONYX-BOOT: ' markers of which nine are the new 'ONYX-BOOT: ac: ' family, and one '[Bds] Unable to boot!' - and differs from 8b2d6b9c only in the eight PcdDxe CodeView bytes this record already blames for the variation. The image kernel field re-hashes to 7ca3fe22 at shim offset 256, so the accepted volume is the one in the file, and each device attempt must name which of the three packs it used instead of 'the current image'.", "The evidence channel is a command, not a habit: scripts/device-ladder.py refuses an image whose SHA-256 differs from --confirm-sha256 and one whose ARM64 text_offset is not zero, can cold-restart the bootloader first, derives its verdict from the polled presence sequence rather than the transfer acknowledgement, and has no flash/erase/write/partition path at all. Its attach subcommand binds panel photographs to a record that boot wrote - one label per frame, PNG/JPEG/GIF/WebP only, every file hashed, and the image the record was made against re-hashed to match, image_gone or MISMATCH - without ever rewriting the verdict or the hash the attempt was bound to, so the stages the host cannot see (menu, keys, payload volume) enter that attempt's own record instead of a separate note. tests/test_device_ladder.py drives stub fastboot/adb binaries through 50 cases covering the refusal set, the state machine and the attach guarantees; that suite is mocked host-side evidence and moves no verdict. The same build is now gated at its input: board.toml names scripts/check-firmware-inputs.py as the [firmware] preflight, so the official firmware step refuses a Mu-Silicium checkout that is not at the endpoint of patches/uefi/ (per-file blob comparison, missing file reported as missing), an onyx.toml whose uefi_fd base/size, compression, header_version or requires_kernel_header drifted, a board.toml compression setting that disagrees with the firmware's, and an onyx.dsc/onyx.fdf that lost the PE alignment, the FdtLib mapping, the -DONYX_FDT_HANDOFF=1 switch or one of the eight required modules. It passes on the checkout that produced FD 7ca3fe22 and skips - with a message, so package --check still runs - when no checkout is named.", "The hand-off was also missing the device connection it depends on. BdsEntry reaches PlatformBootManagerAfterConsole() after the driver load options and EfiBootManagerConnectAllDefaultConsoles() but before any ConnectAll, which happens only inside EfiBootManagerBoot(); UniXNULib/Config.c finds its configuration by LocateHandleBuffer(ByProtocol, gEfiSimpleFileSystemProtocolGuid) and UniXNURamDiskDxe publishes only BlockIo and DevicePath, so with nothing connected the payload volume is not a filesystem yet and the menu would have started without its own configuration. 0014 now connects block devices before the hand-off, logs each connect result and the filesystem count afterwards, and leaves USB, network and display controllers to the path BDS takes next. Rebuilt and accepted as FD 13fb233b with 12 ONYX-BOOT ac markers, packed as image a4c34dd2 whose kernel field re-hashes to that FD, and the series still replays byte-identically; none of it has run on hardware. The next layer of the same gap: SiliciumPkg.dsc.inc sets PcdConInConnectOnDemand, so BdsEntry connects only ConOut and ErrOut before this hook and the ConIn devices that PlatformBootManagerBeforeConsole registered (keypad and USB keyboard) stay unconnected until the lazy path fires on a key wait - a menu started there would draw and ignore every key. The hook now calls EfiBootManagerConnectConsoleVariable(ConIn) and logs the SimpleTextIn handle count. Rebuilt and accepted as FD fdc70a6b (9 modules, 14 of 14 guard markers, 13 ONYX-BOOT ac markers including both counts), packed as image 9a77313f whose kernel field re-hashes to it at shim offset 256 with text_offset zero; the nine-patch replay is still byte-identical and nothing has run on hardware."]
completion = ["The actual FD passes byte-level nested-FV/FFS GUID acceptance; repeated same-hash cold boots reach an interactive menu three times with captured logs. Report the boot result separately from each peripheral subsystem."]
limits = ["This source baseline plus local diff is not a qualified firmware build. The FD acceptance proves volume structure and module presence only, and no image has ever reached a menu, so the firmware boot DTB, early memory ownership, pre-menu logging, BDS launch, GOP and input remain unqualified. The fallback that patches 0012/0013 add is host-tested and has never fired on hardware. The firmware is not bit-reproducible because the PcdDxe CodeView record varies between builds of identical sources, so every claim must name one artifact hash."]
next_action = ["BDS launch is now addressed on the host side: reconnect the device and run the milestone-1 ladder against the bound image hash 83e75046, keeping the no-flash rule and binding every observation to that hash and to a freshly re-initialised bootloader. A single Booting OKAY is not a pass; only a cold boot that reaches the interactive menu three times with a saved log each time satisfies milestone 1."]
evidence = [{ kind = "source", reference = "docs/TAKEOVER-UEFI.md", result = "Records the source baseline versus uncommitted diff, example gate, unresolved firmware-DTB input, host acceptance criteria, QR scope and no-successful-boot status." }, { kind = "source", reference = "docs/DEVICE-DIAGNOSTIC-FAILURE.md", result = "Existing black-screen fastboot boot observation is explicitly a failure/unobserved result, not a UEFI boot." }, { kind = "source", reference = "docs/QR-ADVANCED-LOGGER-INTEGRATION.md", result = "Records the temporary host firmware integration evidence and remaining menu/device verification." }]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["soc/dts/**", "package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["Current Android 17 and historical Android 16 base/merged trees agree on CPU affinities 0x0..0x700, GIC 0x17100000/0x17180000 with stride 0x40000, 19.2 MHz timer and PSCI smc. These bindings are transcribed into soc/dts/sm8735.dtsi; only candidate CPU0 is enabled, not a measured boot affinity. Device interrupt/SMP behavior is unverified."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required cpu and interrupts inputs before implementation."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "scripts/inspect-memory.py", "scripts/inspect-runtime.py", "tests/test_inspect_memory.py", "tests/test_handoff_plan.py", "package/HandoffPlan/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["Current Android runtime evidence includes the live onyx FDT digest and initrd range 0xb5921000..0xb7ffeb04, with the initrd reported reserved by /proc/iomem. The captured FDT memory tuples remain fragmented and include a zero-sized entry; no candidate system-memory range has been promoted into the DTS. Keep the zero-size placeholder and board.example=true. Runtime FDT/iomem evidence is not an EFI memory map and does not establish SEC/DXE ownership; a synthetic HandoffPlan pass does not change that. See docs/RUNTIME-ANDROID17.md and docs/UEFI-HANDOFF.md. scripts/inspect-memory.py now resolves the upstream checkout the way the packaging layout is actually written - UNIXNU_HOME when set, else the sibling named by [package] unixnu in board.toml, then a lowercase sibling, then the documented default - so a plain run finds the FDT parser or fails naming the path a user must create; tests/test_inspect_memory.py covers both branches. This changes how the tool is invoked, not what it measures: the initrd range, the fragmented memory tuples and the untouched zero-size placeholder are unchanged, and board.example stays true."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Runtime capture is property/iomem evidence, not a byte FDT or EFI memory map; zero-size and fragmented memory entries require UEFI/RAM-partition correlation. No device boot capability is verified."]
next_action = ["Correlate initrd reservation and usable RAM spans with Mu-Silicium EFI descriptors; obtain full runtime FDT or equivalent bounded capture before updating board DTS."]
evidence = [{ kind = "source", reference = "docs/RUNTIME-ANDROID17.md", result = "KernelSU read-only capture records runtime identity, memory/reg tuples, initrd start/end and /proc/iomem reservation." }]

