schema_version = 1

[device]
name = "onyx"
soc = "SM8735"
os_profile = "ipados-17.7.11-21H461"
summary = "Evidence-first Redmi Turbo 4 Pro (onyx) reconstruction; no device boot is claimed."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["scripts/extract-images.py", "scripts/inspect-runtime.py", "scripts/CPUID*", "tests/**", "docs/CPUID-PLATFORM-SEED.md", "board.toml", "feeds.toml", "configs/**", "soc/soc.toml", "soc/configs/**", "soc/patches/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["onyx SM8735 source graph, an existing upstream OS profile and real board hardware evidence; see docs/ONYX-REBUILD.md."]
configuration = ["Use ipados-17.7.11-21H461 and onyx_defconfig with tracked local soc/; keep board.example=true until runtime DRAM and the full build source graph are qualified."]
procedure = ["Run python3 scripts/check-inputs.py --unixnu ../unixnu, then the independent upstream porting-record check; the former is expected to fail closed."]
findings = ["The official package --check is intentionally blocked while board.example=true; the fail-closed input gate also reports missing inputs.toml provenance and unresolved static DRAM. The provisional DTS compiles to a 2.1 KiB host DTB only; this is not a boot image or runtime memory evidence."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The local SoC source is minimal, not a complete platform; runtime memory, full source fetch and firmware qualification remain missing."]
next_action = ["Review source availability and runtime DRAM evidence, then verify UEFI handoff and complete kernel build inputs without disabling the board gate."]
evidence = [{ kind = "source", reference = "docs/ONYX-REBUILD.md", result = "Records pinned vendor source and the missing local SoC inputs." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["patches/uefi/**", "package/OnyxMapDxe/**", "package/OnyxBootOptions/**", "tests/test_bootshim_patch.py", "docs/BDS-ONIX-CANDIDATE.md", "docs/BDS-ISOLATED-BUILD.md", "docs/BDS-CANDIDATE-IMAGE.md", "docs/HISTORICAL-COMBO-BOOT-TEST.md", "docs/DIAGNOSTIC-BOOT.md", "docs/DEVICE-DIAGNOSTIC-FAILURE.md", "docs/EFI-MAP-DIAGNOSTIC-RESULT.md", "docs/QR-ADVANCED-LOGGER-INTEGRATION.md", "proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Keep firmware selection and board.example protection; explicitly set bootimg.image.kernel_compression=none. The candidate BootShim source patch is not auto-applied or device-qualified."]
procedure = ["Run offline BootShim patch tests, review docs/UEFI-HANDOFF.md, and capture runtime FDT/initrd plus EFI descriptors before any real boot attempt."]
findings = ["Mu-first BDS candidate uses board-local PlatformBootOptionsLib linked into the BDS static library list (active UniXNU FV app + hidden Mass Storage), with SEC-safe serial DebugLib. Final temporary FD build succeeds SHA-256 7910f75c3cbbcd3db12d90a6208a6a6edb6e65e920898656900aa8235d6775ea; FV includes UniXNU application, UniXNUDxe, OnyxMapDxe and AdvancedLogDxe. No final device retest yet. See docs/BDS-ONIX-CANDIDATE.md."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["No FD or boot image has been validated. x0/runtime DRAM, initrd address and placement, preservation through SEC/DXE, and live dispatch are unmeasured."]
next_action = ["Gather runtime FDT, EFI descriptor and RAM-partition evidence; define early ownership for FDT/initrd buffers before changing dispatch or attempting an image."]
evidence = [{ kind = "source", reference = "docs/ANDROID17-RAMDISK.md", result = "Vendor boot layout and compressed vendor ramdisk were inspected without claiming UniXNU payload discovery." }, { kind = "source", reference = "docs/UEFI-HANDOFF.md", result = "Source audit and actual BootShim header failure/fix reproduced in a temporary host copy." }]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["soc/dts/**", "package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["Current Android 17 and historical Android 16 base/merged trees agree on CPU affinities 0x0..0x700, GIC 0x17100000/0x17180000 with stride 0x40000, 19.2 MHz timer and PSCI smc. These bindings are transcribed into soc/dts/sm8735.dtsi; only candidate CPU0 is enabled, not a measured boot affinity. Device interrupt/SMP behavior is unverified."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required cpu and interrupts inputs before implementation."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "scripts/inspect-memory.py", "scripts/inspect-runtime.py", "tests/test_inspect_memory.py", "tests/test_handoff_plan.py", "package/HandoffPlan/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["HandoffPlan C code checks copied header bounds, page rounding, verified spans and forbidden overlaps without physical reads or HOB writes. KernelSU read-only capture confirms runtime Onyx/SM8735 identity and initrd 0xb5921000..0xb7ffeb04 reserved in /proc/iomem, but fragmented memory/reg is not a clean ADT range. The complete onyx runtime FDT independently matches the public luming SM8735 CPU/GIC/timer/UFS/SMMU/UART/GPU register facts and the Android System RAM run 0x8c0000000..0xaffffefff. Onyx /proc/iomem also reserves the upper part beginning at 0xaeec08000, so luming's full 0x23ffff000 window is not copied. A 2 MiB-aligned pre-reservation candidate 0x8c0000000 + 0x22ec00000 is recorded only for later EFI-map comparison, not selected for ADT. See docs/RUNTIME-ANDROID17.md and docs/bringup/cross-device-reuse.md."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Runtime capture is property/iomem evidence, not a byte FDT or EFI memory map; zero-size and fragmented memory entries require UEFI/RAM-partition correlation. No device boot capability is verified."]
next_action = ["Correlate initrd reservation and usable RAM spans with Mu-Silicium EFI descriptors; obtain full runtime FDT or equivalent bounded capture before updating board DTS."]
evidence = [{ kind = "source", reference = "docs/RUNTIME-ANDROID17.md", result = "KernelSU read-only capture records runtime identity, memory/reg tuples, initrd start/end and /proc/iomem reservation." }]

