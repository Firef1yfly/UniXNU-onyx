schema_version = 1

[device]
name = "onyx"
soc = "SM8735"
os_profile = "ipados-17.7.11-21H461"
summary = "Evidence-first Redmi Turbo 4 Pro (onyx) reconstruction; no device boot is claimed."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["scripts/extract-images.py", "scripts/inspect-runtime.py", "scripts/CPUID*", "tests/**", "docs/CPUID-PLATFORM-SEED.md", "board.toml", "feeds.toml", "configs/**", "soc/soc.toml", "soc/configs/**", "soc/patches/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["onyx SM8735 source graph, an existing upstream OS profile and real board hardware evidence; see docs/ONYX-REBUILD.md."]
configuration = ["Use ipados-17.7.11-21H461 and onyx_defconfig with tracked local soc/; keep board.example=true until runtime DRAM and the full build source graph are qualified. The payload's tools=true is only to expose Tools after an interactive UniXNU menu is working; it does not make the menu or QR exporter available before then."]
procedure = ["Run python3 scripts/check-inputs.py --unixnu ../unixnu, then the independent upstream porting-record check; the former is expected to fail closed."]
findings = ["The official package --check is intentionally blocked while board.example=true; the fail-closed input gate also reports missing inputs.toml provenance and unresolved static DRAM. The provisional DTS compiles to a 2.1 KiB host DTB only; this is not a boot image or runtime memory evidence.", "The repository carries the two workflows the device specification requires: porting-record.yml runs the shared record check on every push and pull request, and package.yml builds the same two artifacts from a clean checkout with the seed taken from the UNIXNU_UNIQUE_CHIP_ID secret. Pushing them needs a token with the workflow scope, which the default device token does not have."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The local SoC source is minimal, not a complete platform; runtime memory, full source fetch and firmware qualification remain missing."]
next_action = ["Review source availability and runtime DRAM evidence, then verify UEFI handoff and complete kernel build inputs without disabling the board gate."]
evidence = [{ kind = "source", reference = "docs/ONYX-REBUILD.md", result = "Records pinned vendor source and the missing local SoC inputs." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["patches/uefi/**", "package/OnyxMapDxe/**", "package/OnyxBootOptions/**", "tests/test_bootshim_patch.py", "tests/test_accept_firmware.py", "scripts/accept-firmware.py", "docs/TAKEOVER-UEFI.md", "docs/BDS-ONIX-CANDIDATE.md", "docs/BDS-ISOLATED-BUILD.md", "docs/BDS-CANDIDATE-IMAGE.md", "docs/HISTORICAL-COMBO-BOOT-TEST.md", "docs/DIAGNOSTIC-BOOT.md", "docs/DEVICE-DIAGNOSTIC-FAILURE.md", "docs/EFI-MAP-DIAGNOSTIC-RESULT.md", "docs/QR-ADVANCED-LOGGER-INTEGRATION.md", "proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Select the UEFI implementation, required boot services, framebuffer/input paths, and logger source for onyx; retain the source revision and artifact hash for each build."]
configuration = ["Keep board.example=true and the unresolved firmware-DTB selection. Keep kernel_compression=none aligned with the Mu device config. tools=true enables only the menu-stage Tools entry and must not be used as a pre-menu log claim."]
procedure = ["Run the offline source patch checks and scripts/accept-firmware.py against an actual 3 MiB FD; inspect BDS dispatch and framebuffer/input logs. Only proceed to device tests when an earlier log channel, recovery method and image hash are documented."]
findings = ["Existing evidence records one prior fastboot boot attempt accepted by the bootloader but ending black-screen with no ADB and no pstore; this is a failed/unobserved UEFI-menu attempt, not a successful firmware boot. The on-device QR exporter is usable only after an interactive menu; it cannot diagnose pre-menu hangs. See docs/TAKEOVER-UEFI.md, docs/DEVICE-DIAGNOSTIC-FAILURE.md and docs/QR-ADVANCED-LOGGER-INTEGRATION.md.", "A host build from an isolated Mu-Silicium checkout (1d0f1e41 plus the local diff, LLVM/LLD 22.1.8, pinned submodule commits) produced a 3 MiB FD, SHA-256 bf2d6ae3aa96436d454cfea4a24434d092e95908536f5ea99d7c993747ffbfee, that scripts/accept-firmware.py resolves to 109 inner FFS files containing every required module. Two consecutive builds of identical sources differ in exactly eight bytes: the CodeView RSDS signature of PcdDxe. SEC's __TIME__/__DATE__ banner was the initial suspect but is not the cause, and adding /Brepro to every link line did not remove the variation, so the firmware is not bit-reproducible and each tested image must be bound by its own SHA-256.", "BootShim now writes the shim-plus-FD image size, keeps the bootloader x0 instead of an appended DTB, fails closed before any store when source and destination overlap, and publishes relocated instructions with a dc cvac/dsb/ic iallu/isb sequence. SEC validates the incoming FDT with a full libfdt tree check and requires the FDT and initrd to sit inside a reserved board-input region before publishing the handoff HOB; a missing initrd is an explicit error, never a silent downgrade. All of this is host-tested only.", "A live capture on 2026-11-28 recorded linux,initrd-start=0xb5921000 and initrd-end=0xb7ffeb18, whose end is not sector aligned; the first validator rejected that genuine handoff, so the range is now rounded up to the next sector with the padded end (0xb8000000) still inside the Kernel reservation. No firmware reservation (UEFI_FD, stack, SEC/DXE heaps) overlaps the payload.", "Cross-checking the validator against the descriptors in MemoryMapLib.c exposed a real defect: XBL_DT, where the bootloader places the device tree, is a memory-reserved descriptor rather than system memory, so requiring EFI_RESOURCE_SYSTEM_MEMORY excluded the one region that must be accepted. The reservation is now the discriminating test and the name allowlist keeps display, modem PIL and AOP carve-outs out. With the live map the validator accepts a tree in XBL_DT, rounds the captured initrd end from 0xb7ffeb18 to 0xb7ffec00 inside the Kernel reservation, and rejects trees in the firmware footprint, the initrd without that reservation, and a payload running past 0xb8000000.", "ro.boot.flash.locked=1 with verifiedbootstate=green on the same capture means the bootloader is still locked, so a locked state refuses fastboot boot of an unsigned image and the verification ladder cannot begin until Mi Unlock is completed with the stock archive at hand.", "Device attempts 2026-11-28: a spin-probe shim with a valid ARM64 header that branches to itself forever was acknowledged with Booting OKAY, and the device still returned to fastboot within about a second, reproducibly after a clean reboot-bootloader. An unconditional self-branch cannot return, so the acknowledgement covers the download and not execution. The same file also produced Load Error depending on the state a previous failed attempt left behind, so one OKAY proves nothing; each result must name the image hash and whether the bootloader was freshly re-initialised. Screen state is not a signal here, since a stock boot also shows no logo until its second stage.", "Root cause of the silent boot failure found 2026-11-28: the onyx ABL adds the arm64 header text_offset to the jump address. Stock boot_a carries 0 there; every UniXNU image carried the firmware base 0xa7100000, so the CPU was sent past the end of RAM and the board fell back to fastboot. Signing is not the obstacle, since a stock image with one byte flipped still booted Android and showed the 18d1:d00d to disconnected to 18d1:4e11 pattern, while our images never produced the disconnect. Patching only text_offset to zero made a self-branching shim hang the device for the rest of the observation, so the shim was executing. make-menu-image.py now zeroes that field after the packer verifies its output and records the change. Any onyx image from the stock packer without this adjustment reports Booting OKAY and does nothing.", "Two output paths behave differently on this board: Print through ConOut and GraphicsConsole renders nothing, while DEBUG output does appear because the platform SerialPortLib draws into the framebuffer. Every earlier diagnostic that used Print therefore ran and stayed invisible, and the BDS failure message travels the same path, so a grey panel cannot be read as a specific failure. The bring-up report now uses DEBUG at ERROR level, which the platform debug level cannot filter.", "The platform debug level stays at its default: restricting it to errors made the framebuffer draw nothing at all, not even the bring-up report. Patch 0009 carries the DSC and FDF wiring for that driver and 0011 the driver itself; both must stay in step with the record.", "The bring-up report driver now depends on gEfiGraphicsOutputProtocolGuid instead of dispatching with TRUE: placed early it ran before the graphics and firmware-volume plumbing it reads, which is why its report never appeared.", "A grey panel cannot distinguish a driver that never ran from one that ran with a broken display path, so the report driver now powers the board off after printing. Staying dark instead of returning to Android is a display-independent proof that the driver executed."]
completion = ["The actual FD passes byte-level nested-FV/FFS GUID acceptance; repeated same-hash cold boots reach an interactive menu three times with captured logs. Report the boot result separately from each peripheral subsystem."]
limits = ["This source baseline plus local diff is not a qualified firmware build. There is no current FD validated by the acceptance script and no successful device boot. The firmware boot DTB, early memory ownership, pre-menu logging, BDS launch, GOP and input remain unqualified."]
next_action = ["Finish source-side firmware and SEC integration, build the FD, run the FD acceptance script, and record the new source revision and hashes before any controlled fastboot boot test."]
evidence = [{ kind = "source", reference = "docs/TAKEOVER-UEFI.md", result = "Records the source baseline versus uncommitted diff, example gate, unresolved firmware-DTB input, host acceptance criteria, QR scope and no-successful-boot status." }, { kind = "source", reference = "docs/DEVICE-DIAGNOSTIC-FAILURE.md", result = "Existing black-screen fastboot boot observation is explicitly a failure/unobserved result, not a UEFI boot." }, { kind = "source", reference = "docs/QR-ADVANCED-LOGGER-INTEGRATION.md", result = "Records the temporary host firmware integration evidence and remaining menu/device verification." }]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["soc/dts/**", "package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["Current Android 17 and historical Android 16 base/merged trees agree on CPU affinities 0x0..0x700, GIC 0x17100000/0x17180000 with stride 0x40000, 19.2 MHz timer and PSCI smc. These bindings are transcribed into soc/dts/sm8735.dtsi; only candidate CPU0 is enabled, not a measured boot affinity. Device interrupt/SMP behavior is unverified."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required cpu and interrupts inputs before implementation."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "scripts/inspect-memory.py", "scripts/inspect-runtime.py", "tests/test_inspect_memory.py", "tests/test_handoff_plan.py", "package/HandoffPlan/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["Current Android runtime evidence includes the live onyx FDT digest and initrd range 0xb5921000..0xb7ffeb04, with the initrd reported reserved by /proc/iomem. The captured FDT memory tuples remain fragmented and include a zero-sized entry; no candidate system-memory range has been promoted into the DTS. Keep the zero-size placeholder and board.example=true. Runtime FDT/iomem evidence is not an EFI memory map and does not establish SEC/DXE ownership; a synthetic HandoffPlan pass does not change that. See docs/RUNTIME-ANDROID17.md and docs/UEFI-HANDOFF.md."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Runtime capture is property/iomem evidence, not a byte FDT or EFI memory map; zero-size and fragmented memory entries require UEFI/RAM-partition correlation. No device boot capability is verified."]
next_action = ["Correlate initrd reservation and usable RAM spans with Mu-Silicium EFI descriptors; obtain full runtime FDT or equivalent bounded capture before updating board DTS."]
evidence = [{ kind = "source", reference = "docs/RUNTIME-ANDROID17.md", result = "KernelSU read-only capture records runtime identity, memory/reg tuples, initrd start/end and /proc/iomem reservation." }]

