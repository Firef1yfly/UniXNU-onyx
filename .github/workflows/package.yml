name: package

# Onyx packaging action (docs/porting/packaging.md in UniXNU). The firmware
# repository below is this board's; the device name appears in the artifact
# paths. The platform seed comes from the repository secret
# UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's artifacts
# belong to one device alone: download them, then delete the run. Run it in a
# fork of the device repository.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Firef1yfly/Mu-Silicium   # this board's firmware checkout
          path: Mu-Silicium
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          # Fail fast, naming the tool, before forty minutes of build. This list
          # is the template's, minus nothing: the action uploads kernel.macho, so
          # the kernel and IPSW tools (xcodebuild, aea, compression_tool, ipsw)
          # are part of the packaging stage even while the port has no kernel
          # inputs yet. Dropping them only moves the failure past the build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../Mu-Silicium
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/onyx/*/*/boot/boot.img
            UniXNU/out/onyx/*/*/payload/payload.img
            UniXNU/out/onyx/*/*/kernel/kernel.macho
            UniXNU/out/onyx/*/*/package.manifest.json
